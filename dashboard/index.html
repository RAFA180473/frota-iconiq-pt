<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlo de Frota ICONIQ</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ /* fundo branco, caixas a negro, turquesa como destaque; resumo antes do detalhe */
color-scheme:light;--bg:#fff;--page:#05141F;--pmute:#4a5560;--card:#05141F;--ink:#f4f6f5;--mute:#aab3b0;--line:#212E3E;--acc:#00F2D7;--accbg:#0b3b3c;
--red:#ff9a90;--redbg:#4a1f1c;--amb:#f2c466;--ambbg:#40320f;--ok:#7fd49b;--okbg:#173524;
--disp:'Inter Tight','Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
header{padding:20px 20px 0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
h1{font:700 24px/1.2 var(--disp);margin:0;text-wrap:balance}h2{font:700 17px/1.3 var(--disp);margin:0 0 4px}h3{font:600 14px var(--body);margin:0}
.sub{color:var(--mute);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 20px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:500;border:1px solid var(--line);background:var(--card)}
nav a.on{background:var(--acc);color:var(--card);border-color:var(--acc)}nav a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:20px;display:grid;gap:16px;max-width:1400px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}.kp b{display:block;font:700 26px/1.1 var(--disp);font-variant-numeric:tabular-nums}.kp span{color:var(--mute);font-size:12.5px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}td.w{white-space:normal;min-width:160px}
.p{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}.p.r{background:var(--redbg);color:var(--red)}.p.a{background:var(--ambbg);color:var(--amb)}.p.g{background:var(--okbg);color:var(--ok)}.p.n{background:var(--accbg);color:var(--acc)}
tr.hl td{background:var(--redbg)}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button,.btn{font:500 13px var(--body);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:var(--card)}
input[type=search]{font:13px var(--body);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:220px}
.flag{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}.flag:last-child{border:0}.flag b.n{font:700 20px var(--disp);min-width:44px;text-align:right}
.note{background:var(--ambbg);color:var(--amb);border-radius:6px;padding:10px 12px;font-size:13px}
.mail{display:none;margin-top:12px;border:1px solid var(--acc);border-radius:8px;padding:12px;background:var(--accbg)}.mail.show{display:block}.mail pre{white-space:pre-wrap;font:13px/1.5 var(--body);background:var(--card);border-radius:6px;padding:10px;margin:8px 0;color:var(--ink)}
section{display:none;gap:16px}section.on{display:grid}label.c{display:inline-flex;gap:4px;align-items:center;margin-right:10px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

body{color:var(--page)}header .sub,main>.sub{color:var(--pmute)}
nav{background:var(--bg);border-bottom:2px solid var(--page)}nav a{background:var(--bg);color:var(--page);border-color:var(--page)}nav a.on{background:var(--page);color:var(--bg);border-color:var(--page);box-shadow:inset 0 -3px 0 var(--acc)}
.card,.kp div{color:var(--ink);border-color:var(--card)}.kp b{color:var(--acc)}.card a{color:var(--acc)}
.card button,.card .btn{background:#212E3E;color:var(--ink);border-color:var(--line)}.card button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}.card button.pri{background:var(--acc);border-color:var(--acc);color:var(--card)}
.card input[type=search]{background:#212E3E;color:var(--ink);border-color:var(--line)}.card input[type=checkbox]{accent-color:var(--acc)}
main>.note{background:#fdf1d6;color:#6b4500}.mail pre{background:#212E3E}
.brand{display:flex;align-items:center;gap:12px}.logo{font:700 26px/1 var(--disp);letter-spacing:.06em;color:var(--page);border-bottom:3px solid var(--acc);padding-bottom:2px}
.logoimg{height:44px;width:auto;display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.card button.fb{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;white-space:normal;line-height:1.3}
.card button.fb b{font:700 22px/1 var(--disp);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}.fb b.r{color:var(--red)}.fb b.a{color:var(--amb)}.fb b.g{color:var(--ok)}
.card button.fb.on{background:var(--accbg);border-color:var(--acc);color:var(--ink)}
main>*{min-width:0}
.kp div{container-type:inline-size}.kp div.kc{cursor:pointer;transition:border-color .15s,transform .15s}.kp div.kc:hover,.kp div.kc:focus-visible{border-color:var(--acc);transform:translateY(-2px);outline:none}.kp div.kc i{display:block;font-style:normal;font-size:11.5px;color:var(--acc);margin-top:4px;opacity:.75}.kp div.kc:hover i{opacity:1}.kp b.lg{font-size:clamp(14px,12.5cqi,26px);white-space:nowrap}
</style></head><body>

<div class="card" id="dcob"><h2>Coberturas e custo por modelo de frota</h2><p class="sub">Prémio total anual por unidade, com todas as coberturas. O custo por mês é o anual a dividir por 12.</p>${tbl([['Modelo de frota',r=>esc(r.mf)],['Viaturas',r=>r.n],['Coberturas',r=>esc(r.cob)],['Capital vidros',r=>r.vid?eur(r.vid):''],['Prémio RC',r=>eur(r.rc)],['Prémio danos próprios',r=>r.dp?eur(r.dp):''],['Restantes',r=>eur(r.rest)],['Prémio total anual',r=>eur(r.pt)],['Custo / mês',r=>eur(r.pt/12)],['Total do grupo / mês',r=>eur(r.pt/12*r.n)]],Object.values(g).sort((a,b)=>b.n-a.n))}
<p class="sub">Siglas: ${used.map(c=>`${c} = ${COB[c]||'?'}`).join('; ')}. Leitura habitual das siglas; a confirmar com a Bervid.</p></div>

<div class="fl">${['A Decorrer','Concluído','Todos'].map(z=>`<button data-s="${z}" class="${z===sf?'on':''}">${z}</button>`).join('')}</div>
${tbl([['Processo',r=>esc(r.id)],['Matrícula',r=>mN(r.m)],['Data',r=>esc(r.data)],['Estado',r=>r.estado==='A Decorrer'?pill('Em aberto','a'):pill('Concluído','g')],['Dias',r=>r.estado==='A Decorrer'?r.dias:''],['Claim WheelSys',r=>r.claim==='Sim'?pill('Sim','g'):r.claim==='Não'?pill('Sem claim','r'):pill('Outra data','a')],['Data claim',r=>esc(r.cdata)],['Claim',r=>esc(r.cfechado)],['Causa no WheelSys',r=>esc(r.ccausa),'w'],['Viatura',r=>wsP(r.ws)]],rows,r=>r.estado==='A Decorrer'&&r.claim!=='Sim'?'hl':'')}</div>
<div class="note">Valores de indemnização recebidos ou pendentes e motivo da pendência: a página de acompanhamento do sinistro não carregou nesta recolha, por isso estas colunas ainda não existem.</div>
<div class="card" id="dclaims"><h2>Claims abertos no WheelSys (${D.WCo.length})</h2>${tbl([['Matrícula',r=>mN(r.m)],['Data',r=>esc(r.data)],['Estação',r=>esc(r.est)],['Contrato',r=>esc(r.rnt)],['Condição',r=>esc(r.cond)],['Tipo',r=>esc(r.tipo)],['Culpa',r=>esc(r.culpa)],['Tem processo na Fidelidade',r=>r.fid?pill('Sim','g'):pill('Não','n')]],D.WCo.sort((a,b)=>a.data<b.data?1:-1))}</div>`};
const sel={};let acc={},dbRef=null,dbMsg='A ligar à lista de exceções aceites…';
const incTp=()=>D.incT.filter(x=>!acc[x.m]),incTa=()=>D.incT.filter(x=>acc[x.m]);

function semDisp(){const c=[['Matrícula',r=>mN(r.m)],['Marca',r=>esc(r.marca)],['Modelo',r=>esc(r.modelo),'w'],['Estado WheelSys',r=>wsP(r.ws)],['Contrato',r=>esc(r.rnt)],['Data de entrada',r=>esc(r.entrada||'')],['Validação',accBox]];
return `<div class="card" id="fdet"><h2>Viaturas ativas sem TARGA: por tratar (${incTp().length})</h2><p class="sub">Marque a caixa quando está aceite que a viatura não tem TARGA. Fica identificada e sai do alerta para toda a equipa.</p>${dbMsg?`<p class="note">${esc(dbMsg)}</p>`:''}${tbl(c,incTp())}</div>

function act(key,title,rows,to,greet,line,cov){const cols=[['',(r)=>`<input type="checkbox" id="${key}-${r.m}" data-k="${key}" data-m="${r.m}" ${sel[key+r.m]?'checked':''} aria-label="Selecionar ${r.m}">`],['Matrícula',r=>mN(r.m)],['Marca',r=>esc(r.marca)],['Modelo',r=>esc(r.modelo),'w'],['Estado WheelSys',r=>wsP(r.ws)],['Contrato',r=>esc(r.rnt)],/^inc/.test(key)?['Data de entrada',r=>esc(r.entrada||'')]:['Data de saída (Defleet)',r=>esc(r.saida||'')]];
if(rows[0]&&'un' in rows[0])cols.push(['Unidade Targa',r=>mN(r.un)],['Zona',r=>esc(r.zona)]);

box.innerHTML=`<b>Para:</b> ${esc(to)}<br><b>Assunto:</b> ${esc(subj)}<pre id="tx-${key}">${esc(body)}</pre><div class="fl"><button data-copy="${key}">Copiar texto</button><a class="btn" href="${href}">Abrir no programa de email</a><span class="sub" id="cp-${key}">Se o botão de email não abrir, copie o texto e os endereços.</span></div>`}
function go(){const h=(location.hash||'#resumo').slice(1),t=TABS.find(x=>x[0]===h)?h:'resumo';$('#nav').innerHTML=TABS.map(x=>`<a href="#${x[0]}" class="${x[0]===t?'on':''}">${x[1]}</a>`).join('');$('#main').innerHTML=H[t]();document.querySelectorAll('.kp b').forEach(b=>{if(b.textContent.length>7)b.classList.add('lg')})}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.go){e.preventDefault();goto(e.target.dataset.go)}});

document.addEventListener('input',e=>{if(['zq','gq','vvq','fq'].includes(e.target.id)){const id=e.target.id;if(id==='zq')zq=e.target.value;else if(id==='gq')gq=e.target.value;else if(id==='vvq')vvq=e.target.value;else fq=e.target.value;const p=e.target.selectionStart;go();const n=$('#'+id);n.focus();n.setSelectionRange(p,p)}});
async function setAcc(m,on,el){if(!dbRef){el.checked=!on;return}el.disabled=true;const v=D.incT.find(x=>x.m===m)||{};
try{if(on)await dbRef.doc('aceites/'+m).set({matricula:m,marca:v.marca||'',modelo:v.modelo||'',em:new Date().toISOString().slice(0,10)});else await dbRef.doc('aceites/'+m).delete();dbMsg=''}
catch(x){el.checked=!on;el.disabled=false;dbMsg=x&&x.code==='invalid_argument'?'Não tem permissão para validar. Peça acesso de Contribuidor a quem partilhou a página.':'Não foi possível guardar a validação. Tente de novo.';go()}}
(async()=>{let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(x){}
if(!db){dbMsg='A validação não está disponível nesta vista. Abra a página com sessão iniciada no Claude.';go();return}

db.collection('aceites').onSnapshot(s=>{const n={};s.docs.forEach(d=>{const x=d.data();if(x)n[d.id]=x});acc=n;if(!s.metadata.fromCache){clearTimeout(tm);dbMsg=''}go()},e=>{clearTimeout(tm);dbMsg='A lista de exceções aceites deixou de estar disponível nesta visita.';dbRef=null;go()})})();
window.addEventListener('hashchange',go);$('#ger').textContent=D.gerado;go();

})();
